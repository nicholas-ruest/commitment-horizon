[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.99.0"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
sha2 = "0.10.8"
hex = "0.4.3"
tempfile = "3.20.0"
tokio = { version = "1.45.0", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
axum = { version = "0.8.4", features = ["json", "macros"] }
tower = { version = "0.5.2", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6.6", features = ["cors", "trace", "request-id", "limit"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
uuid = { version = "1.16.0", features = ["v4", "serde"] }
clap = { version = "4.5.37", features = ["derive"] }
regorus = "=0.13.0"
ruvector-core = { version = "=2.4.0", default-features = false, features = ["memory-only"] }
rvf-runtime = "=0.3.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

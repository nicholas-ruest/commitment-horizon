<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Commitment evaluation flow</title><desc id="d">Browser evidence passes through policy, statistical intelligence, RuVector recall and RVF audit.</desc><rect width="1200" height="520" rx="28" fill="#0b1120"/><style>.b{fill:#15223a;stroke:#365078;stroke-width:2}.h{fill:#eef3ff;font:700 19px system-ui}.s{fill:#9fb0ca;font:14px system-ui}.f{fill:none;stroke:#55d6be;stroke-width:4;stroke-dasharray:12 10;animation:dash 2s linear infinite}@keyframes dash{to{stroke-dashoffset:-44}}</style><text x="55" y="65" class="h" font-size="28">Executed product path</text><path class="f" d="M190 170 H400 M600 170 H790 M980 170 V350 H790 M600 350 H400 M190 350 H145 V230"/><g><rect class="b" x="55" y="120" width="135" height="100" rx="16"/><text class="h" x="82" y="160">React UI</text><text class="s" x="75" y="187">real actions</text><rect class="b" x="400" y="120" width="200" height="100" rx="16"/><text class="h" x="438" y="158">Axum API</text><text class="s" x="423" y="186">auth · validation</text><rect class="b" x="790" y="120" width="190" height="100" rx="16"/><text class="h" x="812" y="158">Orchestrator</text><text class="s" x="817" y="186">typed use case</text><rect class="b" x="790" y="300" width="190" height="100" rx="16"/><text class="h" x="820" y="338">Research</text><text class="s" x="810" y="365">conformal · e-value</text><rect class="b" x="400" y="300" width="200" height="100" rx="16"/><text class="h" x="436" y="338">RuVector</text><text class="s" x="431" y="365">analogue recall</text><rect class="b" x="55" y="300" width="135" height="100" rx="16"/><text class="h" x="99" y="338">RVF</text><text class="s" x="76" y="365">audit + restart</text></g><text class="s" x="55" y="468">The animation shows the live request path; every node remains legible when motion is disabled.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Commitment Horizon</title><desc id="d">An animated service commitment signal approaches a risk horizon while evidence is archived.</desc><rect width="1200" height="420" rx="30" fill="#080d18"/><defs><linearGradient id="g"><stop stop-color="#55d6be"/><stop offset="1" stop-color="#699cff"/></linearGradient></defs><text x="70" y="100" fill="#eef3ff" font-family="system-ui" font-size="58" font-weight="700">Commitment Horizon</text><text x="73" y="140" fill="#9fb0ca" font-family="system-ui" font-size="21">See operational promises fail before customers do.</text><path d="M70 310 C250 255 335 330 500 235 S760 115 1130 205" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/><path d="M70 245 H1130" stroke="#ff6d7a" stroke-width="2" stroke-dasharray="10 12"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2s" repeatCount="indefinite"/></path><text x="915" y="230" fill="#ff9ba5" font-family="ui-monospace" font-size="16">RISK HORIZON</text><circle r="13" fill="#fff"><animateMotion dur="5s" repeatCount="indefinite" path="M70 310 C250 255 335 330 500 235 S760 115 1130 205"/></circle><g fill="#55d6be"><circle cx="180" cy="285" r="5"/><circle cx="470" cy="250" r="5"/><circle cx="770" cy="156" r="5"/></g><text x="73" y="380" fill="#55d6be" font-family="ui-monospace" font-size="16">ADAPTIVE CONFORMAL · ANYTIME E-PROCESS · RUVECTOR · RVF</text></svg>
